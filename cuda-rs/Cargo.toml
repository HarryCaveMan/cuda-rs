[package]
name = "cuda-rs"
version = "13.0.1"
authors = ["Ming Yang <ymviv@qq.com>","Harris Joseph <harris.joseph.088@gmail.com>"]
description = "A safe rust wrapper for CUDA Driver/Runtime APIs"
repository = "https://github.com/vivym/cuda-rs"
readme = "README.md"
keywords = ["cuda", "ffi"]
license = "MIT/Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cuda-rs-sys = { package = "cuda-rs-sys", version= "0.2", git = "https://github.com/HarryCaveMan/cuda-rs.git", branch = "upgrade_deprecated" }
enum_primitive = "0.1"
num-traits = "0.2"
thiserror = "1"
